<figure class="fce-diagram">
<svg viewBox="0 0 500 430" role="img" aria-labelledby="d1t d1d" xmlns="http://www.w3.org/2000/svg" font-family="Montserrat, Arial, sans-serif">
  <title id="d1t">Anatomy of a 75-ball bingo card</title>
  <desc id="d1d">Five columns labelled B, I, N, G and O, each drawing from its own range of fifteen numbers — B from 1 to 15, I from 16 to 30, N from 31 to 45, G from 46 to 60, and O from 61 to 75 — with a free space in the centre.</desc>
  <g text-anchor="middle">
    <!-- column headers -->
    <text x="70"  y="40" font-size="34" font-weight="700" fill="#b0122b">B</text>
    <text x="160" y="40" font-size="34" font-weight="700" fill="#b0122b">I</text>
    <text x="250" y="40" font-size="34" font-weight="700" fill="#b0122b">N</text>
    <text x="340" y="40" font-size="34" font-weight="700" fill="#b0122b">G</text>
    <text x="430" y="40" font-size="34" font-weight="700" fill="#b0122b">O</text>
    <text x="70"  y="66" font-size="12.5" fill="#6b6b70">1&#8211;15</text>
    <text x="160" y="66" font-size="12.5" fill="#6b6b70">16&#8211;30</text>
    <text x="250" y="66" font-size="12.5" fill="#6b6b70">31&#8211;45</text>
    <text x="340" y="66" font-size="12.5" fill="#6b6b70">46&#8211;60</text>
    <text x="430" y="66" font-size="12.5" fill="#6b6b70">61&#8211;75</text>
  </g>
  <g font-size="22" font-weight="600" fill="#16161a" text-anchor="middle">
    <!-- 5x5 grid: rects (fill/stroke) then numbers -->
    <g fill="#ffffff" stroke="#d8d8d2" stroke-width="1.5">
      <rect x="25"  y="86"  width="90" height="62"/><rect x="115" y="86"  width="90" height="62"/><rect x="205" y="86"  width="90" height="62"/><rect x="295" y="86"  width="90" height="62"/><rect x="385" y="86"  width="90" height="62"/>
      <rect x="25"  y="148" width="90" height="62"/><rect x="115" y="148" width="90" height="62"/><rect x="205" y="148" width="90" height="62"/><rect x="295" y="148" width="90" height="62"/><rect x="385" y="148" width="90" height="62"/>
      <rect x="25"  y="210" width="90" height="62"/><rect x="115" y="210" width="90" height="62"/><rect x="205" y="210" width="90" height="62" fill="#b0122b" stroke="#b0122b"/><rect x="295" y="210" width="90" height="62"/><rect x="385" y="210" width="90" height="62"/>
      <rect x="25"  y="272" width="90" height="62"/><rect x="115" y="272" width="90" height="62"/><rect x="205" y="272" width="90" height="62"/><rect x="295" y="272" width="90" height="62"/><rect x="385" y="272" width="90" height="62"/>
      <rect x="25"  y="334" width="90" height="62"/><rect x="115" y="334" width="90" height="62"/><rect x="205" y="334" width="90" height="62"/><rect x="295" y="334" width="90" height="62"/><rect x="385" y="334" width="90" height="62"/>
    </g>
    <!-- row 1 --><text x="70" y="125">7</text><text x="160" y="125">22</text><text x="250" y="125">38</text><text x="340" y="125">52</text><text x="430" y="125">68</text>
    <!-- row 2 --><text x="70" y="187">2</text><text x="160" y="187">29</text><text x="250" y="187">41</text><text x="340" y="187">47</text><text x="430" y="187">63</text>
    <!-- row 3 (free centre) --><text x="70" y="249">14</text><text x="160" y="249">18</text><text x="250" y="249" font-size="15" font-weight="700" fill="#ffffff">FREE</text><text x="340" y="249">59</text><text x="430" y="249">71</text>
    <!-- row 4 --><text x="70" y="311">9</text><text x="160" y="311">25</text><text x="250" y="311">33</text><text x="340" y="311">50</text><text x="430" y="311">74</text>
    <!-- row 5 --><text x="70" y="373">4</text><text x="160" y="373">16</text><text x="250" y="373">45</text><text x="340" y="373">55</text><text x="430" y="373">61</text>
  </g>
</svg>
<figcaption>How a standard 75-ball card is built: each column draws only from its own range of 15 numbers, and the centre is free. Multiply the possibilities together and you get about 5.52&#160;&#215;&#160;10<sup>26</sup> distinct cards.</figcaption>
</figure>
