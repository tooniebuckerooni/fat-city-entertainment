name: Site health check

# Runs every tool in dry-run and shouts if anything has drifted.
#
# WHY THIS EXISTS
# ---------------
# Almost every tool in _tools/ bakes derived data into HTML: prices into the
# cross-sells, the price ladder, the song-library buy buttons and the campaign
# pages; the tracking snippet into every page; trailing slashes into every
# internal link. All of them are idempotent, so a clean run reports zero
# changes. A run that reports changes means something was edited without the
# matching tool being re-run — and the usual way that happens is a price change
# in LemonSqueezy, which leaves the site advertising a number the checkout will
# not honour.
#
# Nothing here writes to the repo. It reads, compares, and opens a GitHub issue
# if the site has drifted — which reaches the owner by email and on a phone,
# without needing a laptop or a coding sandbox open. That is the whole point:
# it has to survive weeks of nobody looking.

on:
  schedule:
    # 06:23 UTC every Monday. Off the hour so it isn't queued behind the
    # thundering herd of crons that all fire at :00.
    - cron: "23 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: site-health
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install the link checker's deps
        run: npm install --prefix _tools --no-audit --no-fund

      - name: Run every check
        id: checks
        run: |
          set +e
          FAIL=0
          {
            echo "## Site health — $(date -u '+%Y-%m-%d %H:%M UTC')"
            echo

            echo "### Broken links"
            echo '```'
            node _tools/check-links.js 2>&1 | tail -4
            echo '```'
            if ! node _tools/check-links.js 2>&1 | grep -q "broken refs: 0"; then
              echo "**Broken references found.**"
              FAIL=1
            fi
            echo

            echo "### Tools reporting pending changes"
            echo
            echo "Each of these should be a no-op. Anything listed here means the"
            echo "page content and the source data have gone out of sync."
            echo '```'
            # A tool is "drifted" if its dry run says it would write something.
            #
            # The tools do not share an output format — they report "updated : 6",
            # "pages written : 4", "price ladder updated", "Would rewrite 12
            # reference(s)" and so on. An earlier version of this matcher only
            # understood two of those shapes and silently missed a simulated
            # price drift in two of the three tools that should have caught it.
            # If you add a tool here, simulate a real drift and confirm it fires;
            # a health check with blind spots is worse than none, because it
            # reads as an all-clear.
            DRIFT='would (write|add|update|rewrite) [1-9]|Would rewrite [1-9]'
            DRIFT="$DRIFT"'|^(added|updated|refreshed|pending) *: *[1-9]'
            DRIFT="$DRIFT"'|pages (written|updated) *: *[1-9]'
            DRIFT="$DRIFT"'|(ladder|sitemap block) (updated|added)'
            DRIFT="$DRIFT"'|\([1-9][0-9]* would change\)'
            DRIFT="$DRIFT"'|NO LIBRARY PAGE|PROBLEM:|MISSING page|no page found'
            # add-sale-banner reports two counts on one line rather than a
            # write count, because it backfills markup rather than content.
            DRIFT="$DRIFT"'|[1-9][0-9]* (product page|tile)\(s\) would change'
            # CATALOGUE INVERSION *is* a failure, as of 5 Sept 2026. It was
            # excluded while two rungs were knowingly inverted — firing weekly
            # on a known issue trains everyone to ignore the check. That is no
            # longer the situation: the catalogue is monotonic end to end, so
            # zero is the baseline and any inversion is real drift. It is also
            # load-bearing now, because the ladder copy claims "the more you buy
            # at once, the less each night costs" — an inversion makes a live
            # claim false, not just a rung awkward.
            #
            # Still NOT in the list: the seven-rung "LADDER INVERSION" warning,
            # which is the narrower check. CATALOGUE INVERSION covers every
            # pack, including the 2- and 4-packs that are not rungs — and it was
            # a 4-pack that sat inverted for months while the rung table read
            # clean.
            DRIFT="$DRIFT"'|CATALOGUE INVERSION'
            # The nav tools report in three shapes of their own, none of which
            # the patterns above match: "would update: 2 page(s)" has a COLON
            # where 'would update [1-9]' expects a space, and the rename tools
            # lead with "DRY RUN: 3 files". Adding the tools without these
            # patterns would have looked like an all-clear forever.
            DRIFT="$DRIFT"'|would update: *[1-9]'
            # Same colon shape for the other verbs. add-product-gallery counts
            # thumbnail files it would regenerate separately from pages, because
            # a deleted thumbnail changes no HTML and would otherwise report as
            # "0 pages, nothing to do" while the page renders a blank box.
            DRIFT="$DRIFT"'|would (write|add|rewrite): *[1-9]'
            DRIFT="$DRIFT"'|DRY RUN: [1-9][0-9]* files'
            DRIFT="$DRIFT"'|files changed *: *[1-9]'
            # Nav drift is why these are here: post #4 sat live for three weeks
            # with a pre-rename "Generator 2" item after being merged from a
            # stale branch, and features.html/aboutus.html kept the
            # over-optimised "Bingo Card Generator" anchor. Nothing was watching
            # the nav, so a page cloned from an old shell silently kept an old
            # menu. Every one of these is idempotent and reads 0 today.
            #
            # add-product-gallery and build-generator-links joined 11 Sept 2026.
            # Both report "would update: N", which the nav patterns above
            # already cover, and both read 0 today. The gallery one matters
            # because a thumbnail strip points at generated -thumb files: if one
            # is ever deleted the tool regenerates it, and until it is re-run
            # the page shows a blank box rather than a heavier image.
            #
            # set-cta-labels joined with them. It reports "would update: N
            # page(s)". It only ever rewrites a button still reading the generic
            # "Buy & Download", so a label somebody wrote by hand survives both
            # the tool and the Monday run; p18, p65 and p140 are the live proof.
            #
            # build-store-facets and add-store-filters joined 16 Sept 2026 too.
            # The first regenerates assets/js/store-facets.js unconditionally and
            # reports "(1 would change)" against what is on disk, the same shape
            # build-song-library.js uses, so the existing pattern catches it: a
            # product that changes category, gains a song list or loses its
            # playlist links changes its facets, and a stale file would filter it
            # into the wrong set. It also prints PROBLEM: for a facet entry whose
            # product no longer has a tile, which the matcher already catches.
            # Neither tool touches a tile, so neither can affect the tile checks
            # in the exit-status loop below.
            #
            # reorder-product-cta and add-playlist-badge joined 16 Sept 2026.
            # The first keeps the buy button directly under the price on all 95
            # product pages; anything that regenerates a page from an older
            # template would silently drop it back below the description, which
            # is the position the move exists to fix. The second only became
            # checkable here in the same change: it used to re-insert its badge
            # on every run and so always reported a non-zero count, which would
            # have read as permanent drift. Now it fills a marker slot and a
            # clean run reports 0. Both report "would update: N page(s)", which
            # the nav patterns above already match -- confirmed by reverting a
            # real page and watching the matcher fire, then go quiet.
            #
            # tidy-listing-intro and set-delivery-boilerplate joined 17 Sept 2026,
            # the copy-length pass. Both report "would update: N page(s)", which
            # the nav patterns already match; both were proved by reverting a real
            # edit on a real page and watching the matcher fire, then go quiet.
            # tidy-listing-intro also exits non-zero on a HALF-applied page, which
            # is the state worth shouting about: its edits are exact string swaps,
            # so a page that matched four of five has been touched by something
            # else. set-delivery-boilerplate finds its block by opening tag and
            # closing </div> rather than by matching the whole string, because the
            # first draft matched the whole string and silently did 39 of 92 while
            # reporting success.
            #
            # count-subcategory-tiles joined 17 Sept 2026, with the change that
            # retired the storefront's filter chips. It writes a live product
            # count into each subcategory tile ("Music Bingo Card Downloads
            # (53)"), and every count is DERIVED by counting the product tiles
            # on that tile's own link target -- so a product added to, or pulled
            # from, a category leaves the tile quoting a number the category no
            # longer holds until the tool is re-run. That is exactly the drift
            # this workflow exists for, and it is invisible otherwise: the page
            # renders perfectly with a wrong number on it. Reports "would
            # update: N page(s)", which the nav patterns above already match --
            # proved by pulling a real product tile off store/c33/Eras.html and
            # watching the matcher fire, then go quiet.
            #
            # add-city-rounds joined 23 Sept 2026. A live city round is baked
            # twice, onto its city page and into trivia-show-maker/rounds/ for
            # the ?round= autoload, so an edit to _content/city-rounds/ that is
            # not re-run leaves the page and the tool reading different answers.
            # Reports "would update: N file(s)"; proved by going live, editing an
            # answer, and watching the matcher fire, then go quiet.
            #
            # build-city-pages joined the same day. It regenerates every page under
            # /trivia-nights/ from _content/city-pages/, and carries forward the
            # round and JSON-LD blocks other tools own, so an unchanged page reads
            # 0. Proved by editing one sentence of a city's copy without a rebuild
            # and watching "would update: 1" fire, then go quiet after --write.
            for t in add-cross-sell add-price-ladder add-jsonld add-tracking \
                     add-tracklists canonicalize-trailing-slash normalize-url-encoding \
                     bake-buy-links add-page-copy build-song-library build-campaign-pages \
                     add-sale-banner add-product-gallery build-generator-links \
                     add-halloween-banner add-perk-badge add-fact-notes \
                     add-pillar-uplinks reorder-product-cta add-playlist-badge \
                     build-store-facets add-store-filters set-cta-labels \
                     tidy-listing-intro set-delivery-boilerplate \
                     count-subcategory-tiles add-city-rounds build-city-pages add-city-nav \
                     add-app-nav add-trivia-store-nav add-song-lists-nav \
                     add-bingocardmaker-nav rename-generator2-nav \
                     rename-trivia-generator-nav drop-blog-nav-dropdown \
                     restyle-featured-nav remove-costume-performers-nav \
                     vary-bcg-nav-anchor add-halloween-nav tag-bcg-nav-utm; do
              OUT="$(node _tools/$t.js 2>&1)"
              if echo "$OUT" | grep -Eq "$DRIFT"; then
                echo "DRIFTED: $t"
                echo "$OUT" | head -6
                echo "---"
                FAIL=1
              fi
            done
            echo '```'
            echo

            # These two exit non-zero on a real problem rather than reporting a
            # write count, so they are checked by status rather than by matcher.
            # check-value-stacks is the one that guards the club "Quick math"
            # paragraphs — the hand-written prose that advertised $89.00 for
            # months after Bronze dropped to $79.00, which is the exact failure
            # this whole workflow exists to catch in a week instead of in a
            # refund email.
            # check-tile-structure is here because a malformed listing tile is
            # invisible to everything else: on 5 Sept a tile spliced INTO
            # another product's image container left store/c11 showing
            # Christmas with no name or price and fourteen packs not rendering
            # at all, while the tile count was right, check-links.js passed and
            # every price tool reported clean.
            # fix-product-divs is the same class of blind spot one level up, on
            # the PRODUCT page rather than the listing tile: new-product.js put
            # one stray </div> on all 25 pages it had ever generated, closing
            # #wsite-com-product-info-inner right after the description so the
            # buy button and cross-sell became its siblings. Nothing read the
            # shape of a product page until 11 Sept 2026. It is checked by exit
            # status, not by a write count, because an unbalanced page is a
            # defect that is already live.
            echo "### Value stacks, trivia shows, LemonSqueezy checklist, tile and page structure"
            echo '```'
            # check-linked-prices joined 11 Sept 2026: the Halloween hub quoted
            # $39.99 for two days after the pack moved to $35.97, and nothing
            # looked. set-usd-price.js only walks product pages and listing
            # tiles; content pages, campaign specs and blog posts had no check
            # at all. It compares a dollar amount written immediately beside a
            # link to /store/pNN/ against that product's own page.
            # check-css-balance joined 11 Sept 2026. One stray } in
            # site-extras.css broke every rule below it, and the visible symptom
            # was the Halloween perk badge floating off the product image into
            # the breadcrumbs, because the position:relative it needs sat under
            # the damage. Nothing read CSS, and a browser recovers from a stray
            # brace silently by skipping ahead, so the only sign is rules not
            # applying somewhere further down.
            for t in check-value-stacks check-trivia-shows check-ls-links check-tile-structure \
                     fix-product-divs check-linked-prices check-css-balance; do
              OUT="$(node _tools/$t.js 2>&1)"
              if [ $? -ne 0 ]; then
                echo "FAILED: $t"
                echo "$OUT" | tail -12
                echo "---"
                FAIL=1
              else
                echo "$t: OK"
              fi
            done
            echo '```'
            echo

            echo "### Price ladder"
            echo '```'
            node _tools/add-price-ladder.js --preview 2>&1 | tail -14
            echo '```'
            echo

            echo "### Campaign pages"
            echo '```'
            node _tools/build-campaign-pages.js 2>&1 | head -8
            echo '```'
          } > report.md

          echo "fail=$FAIL" >> "$GITHUB_OUTPUT"
          cat report.md

      - name: Open an issue if something drifted
        if: steps.checks.outputs.fail == '1'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('report.md', 'utf8');
            const title = 'Site health: something has drifted';
            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'site-health',
            });
            if (open.length) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: open[0].number, body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels: ['site-health'],
              });
            }

      - name: Close the issue when everything is clean again
        if: steps.checks.outputs.fail == '0'
        uses: actions/github-script@v7
        with:
          script: |
            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'site-health',
            });
            for (const issue of open) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: issue.number,
                body: 'All checks clean again — closing.',
              });
              await github.rest.issues.update({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: issue.number, state: 'closed',
              });
            }
